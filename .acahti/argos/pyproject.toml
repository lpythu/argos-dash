[project]
name = "acahti-argos-argos-dash"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["argospy>=0.6.0"]

[project.entry-points."argos.packs"]
e2e = "e2e_pack.pack:pack"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e_pack"]
