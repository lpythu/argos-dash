when:
  - event: [pull_request, manual]
  - event: [push, manual]
    branch: [test]

labels:
  build: true

steps:
  build:
    pipe: docker-build@v1
    with:
      push: false
      images: |
        argos:${CI_COMMIT_SHA} BASE_IMAGE=harbor.saidc/base/saidc-uv:0.12.0 NODE_IMAGE=harbor.saidc/base/saidc-node:22-pnpm11.12.0
