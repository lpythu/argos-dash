name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag matches dash versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DASH_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CHART_VER=$(python3 -c "import pathlib,re; t=pathlib.Path('chart/Chart.yaml').read_text(); print(re.search(r'(?m)^version:\\s*(\\S+)', t).group(1))")
          APP_VER=$(python3 -c "import pathlib,re; t=pathlib.Path('chart/Chart.yaml').read_text(); print(re.search(r'(?m)^appVersion:\\s*[\"\\']?([^\"\\']+)', t).group(1))")
          echo "tag=$TAG dash=$DASH_VER chart=$CHART_VER app=$APP_VER"
          if [ "$TAG" != "$DASH_VER" ] || [ "$TAG" != "$CHART_VER" ] || [ "$TAG" != "$APP_VER" ]; then
            echo "::error::Tag $TAG must match pyproject.toml and chart/Chart.yaml"
            exit 1
          fi

  deploy-dash:
    needs: check
    runs-on: [self-hosted, buildof]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image and helm office
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/dash-release.sh
